<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MidtermLab 3</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="stylesheet" src="css.css">
</head>

<body class="p-3 mb-2 bg-dark-subtle text-dark-emphasis">
    <header class="text-center"> <br>
        <h1>Sign-in</h1>
    </header>
    <hr>
    <main>
        <section>
            <form>
                <div class="form-group">
                    <label for="exampleInputEmail1">FirstName: </label>
                    <input class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp">
                    <small id="emailHelp" class="form-text text-muted">Don't use your real name</small>
                </div> <br>
                <div class="form-group">
                    <label for="exampleInputEmail1">LastName: </label>
                    <input type="name" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp">
                    <small id="emailHelp" class="form-text text-muted">Don't use your real name</small>
                </div> <br>
                <large class="form-text text-muted">Gender</large>
                <select class="form-control">
                    <option>Other</option>
                    <option>Male</option>
                    <option>Female</option>
                </select> <br>
                <div class="form-group">
                    <label for="exampleInputEmail1">Email:</label>
                    <input type="email" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp">
                    <small id="emailHelp" class="form-text text-muted">Already have an account? try <a
                            href="htmlmain.html">Login</a></small>
                </div> <br>
                <div class="form-group">
                    <label for="exampleInputPassword1">Password</label>
                    <input type="password" class="form-control" id="exampleInputPassword1">
                </div> <br>
                <div class="form-group form-check">
                    <input type="checkbox" class="form-check-input" id="exampleCheck1">
                    <label class="form-check-label" for="exampleCheck1">I agree to Terms and Conditions</label>
                </div>
                <a class="btn btn-primary" href="landing.html" role="button">Log-in</a>
            </form>
        </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
